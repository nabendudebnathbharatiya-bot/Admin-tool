<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>assetpro | Ultimate Editor Tool</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://unpkg.com/dexie/dist/dexie.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lamejs/1.2.1/lame.min.js"></script>
    <style>
        body { -webkit-tap-highlight-color: transparent; }
        .bottom-sheet { transition: transform 0.4s cubic-bezier(0.1, 0.7, 0.1, 1); transform: translateY(100%); }
        .bottom-sheet.active { transform: translateY(0); }
        .active-btn { background: rgba(59, 130, 246, 0.3) !important; border-color: #3b82f6 !important; color: #60a5fa !important; box-shadow: 0 0 20px rgba(59, 130, 246, 0.3); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        @keyframes progress { 0% { width: 0%; } 100% { width: 100%; } }
        .loader-line { animation: progress 2s infinite ease-in-out; }
        .modal-container { transition: opacity 0.3s ease; }
        .modal-box { transition: transform 0.3s ease, opacity 0.3s ease; transform: scale(0.95); opacity: 0; }
        .modal-container.active .modal-box { transform: scale(1); opacity: 1; }
    </style>
</head>
<body class="bg-[#0b0f1a] text-gray-100 font-sans h-screen flex flex-col overflow-hidden select-none">

    <!-- Header -->
    <header class="p-6 border-b border-gray-800 bg-[#0b0f1a]/95 flex justify-between items-center z-40">
        <div class="flex items-center gap-5">
            <h1 class="text-4xl font-black italic text-blue-500 tracking-tighter">asset<span class="text-white">pro</span></h1>
            <button onclick="toggleSheet('projectSheet')" class="text-base font-bold bg-gray-800 px-5 py-2.5 rounded-full border border-gray-700 text-blue-400">
                <i class="fas fa-cube mr-2"></i> <span id="activeProjectName">PROJECT</span>
            </button>
        </div>
        <div id="globalLoader" class="hidden items-center gap-4">
            <span id="loaderText" class="text-xs font-mono text-gray-500"></span>
            <div class="h-2 w-32 bg-gray-800 rounded-full overflow-hidden border border-gray-700">
                <div class="bg-blue-500 h-full loader-line"></div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 overflow-y-auto p-6 pb-40 no-scrollbar">
        <div class="bg-gray-900/60 p-7 rounded-[3rem] border border-gray-800 mb-10 shadow-2xl">
            <p class="text-xs font-black text-gray-500 uppercase mb-5 tracking-[0.2em] text-center">Optimization Factor</p>
            <div class="flex gap-3 overflow-x-auto no-scrollbar pb-4 mb-8">
                <button onclick="setMode(1)" id="m-1" class="mode-btn min-w-[120px] py-5 rounded-[1.5rem] text-sm font-black border border-gray-800 bg-gray-900 transition-all">ORIGINAL</button>
                <script>for(let i=2; i<=10; i++) document.write(`<button onclick="setMode(${i})" id="m-${i}" class="mode-btn min-w-[75px] py-5 rounded-[1.5rem] text-sm font-black border border-gray-800 bg-gray-900 transition-all">${i}X</button>`);</script>
            </div>
            <div id="formatSection" class="space-y-5">
                <div class="flex items-center gap-5"><span class="text-sm font-black text-gray-500 w-20 uppercase">Image</span><div class="flex flex-1 gap-2"><button onclick="setFormat('img', 'png')" id="f-img-png" class="f-img flex-1 py-4 rounded-2xl text-xs font-black border border-gray-800 uppercase">PNG</button><button onclick="setFormat('img', 'jpg')" id="f-img-jpg" class="f-img flex-1 py-4 rounded-2xl text-xs font-black border border-gray-800 uppercase">JPG</button></div></div>
                <div class="flex items-center gap-5"><span class="text-sm font-black text-gray-500 w-20 uppercase">Audio</span><div class="flex flex-1 gap-2"><button onclick="setFormat('aud', 'mp3')" id="f-aud-mp3" class="f-aud flex-1 py-4 rounded-2xl text-xs font-black border border-gray-800 uppercase">MP3</button><button onclick="setFormat('aud', 'wav')" id="f-aud-wav" class="f-aud flex-1 py-4 rounded-2xl text-xs font-black border border-gray-800 uppercase">WAV</button></div></div>
                <div class="flex items-center gap-5"><span class="text-sm font-black text-gray-500 w-20 uppercase">Video</span><div class="flex flex-1 gap-2"><button onclick="setFormat('vid', 'mp4')" id="f-vid-mp4" class="f-vid flex-1 py-4 rounded-2xl text-xs font-black border border-gray-800 uppercase">MP4</button><button onclick="setFormat('vid', 'webm')" id="f-vid-webm" class="f-vid flex-1 py-4 rounded-2xl text-xs font-black border border-gray-800 uppercase">WEBM</button></div></div>
            </div>
        </div>
        <div class="flex justify-between items-center mb-8 px-2">
            <h2 id="currentFolderName" class="text-3xl font-black text-white">Files</h2>
            <span id="fileStats" class="text-sm font-mono text-gray-500">0 ITEMS</span>
        </div>
        <div id="fileGrid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-6"></div>
    </main>

    <!-- Navigation & Modals -->
    <nav class="fixed bottom-0 left-0 right-0 bg-[#0d121f]/95 border-t border-gray-800 p-6 px-12 flex justify-between items-center z-40 backdrop-blur-2xl"><button onclick="toggleSheet('folderSheet')" class="flex flex-col items-center gap-3 text-gray-400"><i class="fas fa-layer-group text-3xl"></i><span class="text-[10px] font-black uppercase tracking-widest">Folders</span></button><button onclick="document.getElementById('fileInput').click()" class="w-20 h-20 bg-blue-600 rounded-[2.5rem] flex items-center justify-center shadow-2xl shadow-blue-600/40 -mt-16 active:scale-90 transition-transform border-8 border-[#0b0f1a]"><i class="fas fa-plus text-white text-3xl"></i><input type="file" id="fileInput" class="hidden" multiple onchange="autoProcess(event)"></button><button onclick="downloadFolderZip()" class="flex flex-col items-center gap-3 text-gray-400"><i class="fas fa-file-export text-3xl"></i><span class="text-[10px] font-black uppercase tracking-widest">Export</span></button></nav>
    <div id="projectSheet" class="bottom-sheet fixed inset-0 bg-black/80 z-50 flex items-end hidden" onclick="if(event.target==this) toggleSheet('projectSheet')"><div class="bg-[#0d121f] w-full rounded-t-[3.5rem] p-10 shadow-2xl"><h3 class="font-black text-2xl mb-8 text-center uppercase tracking-widest">Projects</h3><div id="projectList" class="space-y-4 max-h-[40vh] overflow-y-auto no-scrollbar mb-8 px-2"></div><div class="flex gap-4"><button onclick="createProject()" class="flex-1 py-5 bg-blue-600 text-white rounded-[2rem] font-black text-sm uppercase">New Project</button><button onclick="deleteCurrentProject()" class="px-8 py-5 bg-red-900/20 text-red-500 rounded-[2rem] border border-red-500/20 transition active:bg-red-600 active:text-white"><i class="fas fa-trash-alt"></i></button></div></div></div>
    <div id="folderSheet" class="bottom-sheet fixed inset-0 bg-black/80 z-50 flex items-end hidden" onclick="if(event.target==this) toggleSheet('folderSheet')"><div class="bg-[#0d121f] w-full rounded-t-[3.5rem] p-10 shadow-2xl"><div class="flex justify-between items-center mb-8"><h3 class="font-black text-2xl uppercase tracking-widest">Directories</h3><button onclick="addFolder()" class="bg-blue-600/10 text-blue-500 px-6 py-2 rounded-2xl font-black text-xs tracking-widest">+ NEW</button></div><div id="folderList" class="grid grid-cols-2 gap-4 max-h-[50vh] overflow-y-auto no-scrollbar"></div></div></div>
    <div id="moveSheet" class="bottom-sheet fixed inset-0 bg-black/80 z-[60] flex items-end hidden" onclick="if(event.target==this) toggleSheet('moveSheet')"><div class="bg-[#161b29] w-full rounded-t-[3.5rem] p-10 shadow-2xl"><h3 class="font-black text-xl mb-8 text-center text-blue-400 uppercase tracking-[0.2em]">Move File To</h3><div id="moveFolderList" class="grid grid-cols-2 gap-4"></div></div></div>
    <div id="previewModal" class="fixed inset-0 bg-black/98 z-[100] hidden flex flex-col items-center justify-center p-8 backdrop-blur-xl"><button onclick="closePreview()" class="absolute top-10 right-10 text-white/50 text-4xl"><i class="fas fa-times-circle"></i></button><div id="previewContent" class="max-w-full flex justify-center rounded-[3rem] overflow-hidden shadow-2xl bg-gray-900/50 border border-white/5"></div><h3 id="previewTitle" class="mt-10 text-2xl font-black text-white uppercase tracking-tight text-center">FileName</h3><p id="previewSize" class="text-sm text-emerald-400 font-mono mt-2 uppercase"></p><div class="flex gap-5 mt-12 w-full max-w-sm"><button id="delBtn" class="flex-1 bg-red-900/20 text-red-500 py-6 rounded-[2rem] text-xs font-black uppercase tracking-widest">Delete</button><button id="renBtn" class="flex-1 bg-gray-800 text-white py-6 rounded-[2rem] text-xs font-black uppercase tracking-widest">Rename</button></div></div>
    <div id="customModal" class="modal-container fixed inset-0 bg-black/90 z-[200] hidden items-center justify-center p-8 backdrop-blur-xl"><div class="modal-box bg-[#161b29] w-full max-w-sm rounded-[3rem] p-10 shadow-2xl border border-gray-700"><h3 id="modalTitle" class="font-black text-xl mb-6 text-center text-blue-400 uppercase tracking-[0.2em]">Title</h3><p id="modalMessage" class="text-center text-gray-400 mb-8"></p><input id="modalInput" type="text" class="hidden w-full bg-gray-900 border border-gray-700 rounded-2xl p-4 text-center font-mono mb-8 focus:outline-none focus:ring-2 focus:ring-blue-500"><div id="modalButtons" class="flex gap-4"></div></div></div>
    <video id="hVideo" class="hidden" muted playsinline></video>

    <script>
        // ===================================================================================
        // SCRIPT START
        // ===================================================================================

        // --- ডেটাবেস এবং স্টেট ম্যানেজমেন্ট ---
        const db = new Dexie("assetpro_db_final");
        db.version(1).stores({
            projects: '++id, name',
            folders: '++id, projectId, name',
            files: '++id, folderId, projectId, name, type, oldSize, newSize, blob'
        });

        let currentProjectId = null, currentFolderId = null, currentMode = 1, movingFileId = null;
        let targetFormats = { img: 'png', aud: 'mp3', vid: 'mp4' };

        // --- অ্যাপ ইনিশিয়ালাইজেশন ---
        async function init() {
            let project = await db.projects.orderBy('id').first();
            if (!project) {
                const newProjectId = await db.projects.add({ name: "Default" });
                await db.folders.add({ projectId: newProjectId, name: "Root" });
                currentProjectId = newProjectId;
            } else {
                currentProjectId = project.id;
            }
            
            let folder = await db.folders.where({ projectId: currentProjectId }).first();
            if(folder) currentFolderId = folder.id;

            setMode(1); 
            setFormat('img', 'png'); setFormat('aud', 'mp3'); setFormat('vid', 'mp4');
            await loadApp();
        }
        
        // --- কোর অ্যাপ রেন্ডারিং (অপরিবর্তিত) ---
        async function loadApp() {
            if (!currentProjectId) { console.error("No project selected."); return; }
            const activeProject = await db.projects.get(Number(currentProjectId));
            if (!activeProject) { await init(); return; }
            document.getElementById('activeProjectName').innerText = activeProject.name.toUpperCase();
            await renderProjectList();
            await renderFolderList();
            await loadFiles();
        }
        async function renderProjectList() { const projects = await db.projects.toArray(); document.getElementById('projectList').innerHTML = projects.map(p => `<div onclick="switchProject(${p.id})" class="p-6 rounded-[2rem] flex justify-between items-center transition cursor-pointer ${p.id == currentProjectId ? 'bg-blue-600 text-white shadow-xl' : 'bg-gray-800 hover:bg-gray-700'}"><span class="font-black text-base uppercase tracking-widest">${p.name}</span>${p.id == currentProjectId ? '<i class="fas fa-check-circle text-xl"></i>' : ''}</div>`).join(''); }
        async function renderFolderList() { const folders = await db.folders.where({ projectId: Number(currentProjectId) }).toArray(); const folderHTML = folders.map(f => `<div onclick="switchFolder(${f.id})" ondragover="event.preventDefault(); this.classList.add('bg-blue-600/20')" ondragleave="this.classList.remove('bg-blue-600/20')" ondrop="handleDrop(event, ${f.id})" class="p-7 rounded-[3rem] flex flex-col items-center gap-4 transition-all cursor-pointer ${f.id == currentFolderId ? 'bg-blue-600 text-white shadow-2xl scale-105' : 'bg-gray-800 group hover:bg-gray-700'}"><i class="fas fa-folder text-4xl"></i><span class="text-xs font-black uppercase text-center truncate w-full">${f.name}</span><div class="flex gap-4 mt-2 opacity-0 group-hover:opacity-100 transition"><i onclick="renameFolder(event, ${f.id}, '${f.name}')" class="fas fa-pen p-2 text-xs hover:text-blue-400"></i><i onclick="deleteFolder(event, ${f.id})" class="fas fa-trash-alt p-2 text-xs text-red-500 hover:text-red-300"></i></div></div>`).join(''); document.getElementById('folderList').innerHTML = folderHTML; document.getElementById('moveFolderList').innerHTML = folders.map(f => `<div onclick="executeMove(${f.id})" class="p-6 rounded-3xl bg-gray-800 flex flex-col items-center gap-3 border border-white/5 active:bg-blue-600 transition cursor-pointer"><i class="fas fa-folder text-2xl"></i><span class="text-xs font-bold uppercase">${f.name}</span></div>`).join(''); }
        async function loadFiles() { if (!currentFolderId) { const firstFolder = await db.folders.where({ projectId: Number(currentProjectId) }).first(); if (firstFolder) currentFolderId = firstFolder.id; else { document.getElementById('fileGrid').innerHTML = '<p class="text-gray-500 col-span-full text-center mt-10">No folder found. Create a new one.</p>'; return; } } const files = await db.files.where({ folderId: Number(currentFolderId) }).toArray(); const fInfo = await db.folders.get(Number(currentFolderId)); document.getElementById('currentFolderName').innerText = fInfo ? fInfo.name : "Files"; document.getElementById('fileStats').innerText = `${files.length} ITEMS`; if(files.length === 0) { document.getElementById('fileGrid').innerHTML = '<p class="text-gray-500 col-span-full text-center mt-10">This folder is empty. Click <i class="fas fa-plus"></i> to add files.</p>'; return; } document.getElementById('fileGrid').innerHTML = files.map(file => `<div draggable="true" ondragstart="event.dataTransfer.setData('fId', ${file.id})" class="bg-[#0d121f] border border-gray-800 p-5 rounded-[2.5rem] flex flex-col group active:scale-95 transition-all relative"><div onclick="previewFile(${file.id})" class="h-36 bg-black/40 rounded-[2rem] mb-5 flex items-center justify-center cursor-pointer overflow-hidden"><i class="fas ${file.type.includes('image') ? 'fa-image text-yellow-500' : file.type.includes('video') ? 'fa-video text-red-500' : 'fa-music text-blue-500'} text-5xl opacity-40 group-hover:opacity-100 transition-all duration-300 transform group-hover:scale-110"></i></div><p class="text-base font-black truncate text-white uppercase px-1 mb-2 tracking-tighter" title="${file.name}">${file.name}</p><div class="flex justify-between text-xs font-mono px-1 text-gray-500 italic"><span class="line-through">${(file.oldSize/1024/1024).toFixed(1)}MB</span><span class="text-emerald-500 font-bold not-italic">${(file.newSize/1024/1024).toFixed(1)}MB</span></div><button onclick="openMoveSheet(${file.id})" class="mt-5 text-xs font-black text-blue-500 bg-blue-500/5 rounded-2xl py-4 border border-blue-500/20 uppercase tracking-[0.2em] active:bg-blue-600 active:text-white transition">Move</button></div>`).join(''); }

        // --- ফাইল প্রসেসিং এবং কম্প্রেশন ---
        async function autoProcess(e) {
            const files = Array.from(e.target.files);
            if (!files.length) return;
            
            const loader = document.getElementById('globalLoader');
            const loaderText = document.getElementById('loaderText');
            loader.classList.remove('hidden');
            loader.classList.add('flex');

            const factor = Math.sqrt(1 / currentMode);

            for(let i = 0; i < files.length; i++) {
                const file = files[i];
                loaderText.innerText = `Processing ${i + 1}/${files.length}`;
                try {
                    let blob = file, name = file.name;
                    let newExt = null;

                    if (currentMode > 1) {
                        if (file.type.includes('image')) {
                            newExt = targetFormats.img;
                            blob = await compressImg(file, factor, newExt);
                        } else if (file.type.includes('audio')) {
                            // শুধুমাত্র MP3 টার্গেট করা থাকলেই কম্প্রেশনের চেষ্টা করা হবে
                            if (targetFormats.aud === 'mp3') {
                                // যদি ফাইলটি আগে থেকেই MP3 হয়, তাহলে পুনরায় কম্প্রেস করা হবে না
                                if (file.type === 'audio/mpeg' || file.name.toLowerCase().endsWith('.mp3')) {
                                    console.log(`Skipping compression for existing MP3: ${file.name}`);
                                } else {
                                    // অন্য ফরম্যাটের জন্য কম্প্রেশনের চেষ্টা করা হবে
                                    try {
                                        newExt = 'mp3';
                                        blob = await compressAudio(file, Math.max(32, 192 / currentMode));
                                    } catch (audioError) {
                                        console.error(`MP3 compression failed for '${file.name}'. Saving original.`, audioError);
                                        // কম্প্রেশন ব্যর্থ হলে, ব্যবহারকারীকে জানানো হবে এবং মূল ফাইল সেভ করা হবে
                                        alert(`Could not compress '${file.name}'. The original file has been saved instead.`);
                                        newExt = null; // এক্সটেনশন পরিবর্তন বাতিল
                                        blob = file; // মূল ফাইলটিই ব্লব হিসেবে থাকবে
                                    }
                                }
                            }
                            // যদি টার্গেট ফরম্যাট 'wav' হয়, তাহলে কিছুই করা হবে না, মূল ফাইল সেভ হবে
                        } else if (file.type.includes('video')) {
                            const bitrate = Math.floor(Math.max(200000, 2000000 / currentMode));
                            const result = await compressVid(file, bitrate, targetFormats.vid);
                            blob = result.blob;
                            newExt = result.actualExtension;
                        }
                    }
                    
                    if (newExt) {
                        const nameParts = file.name.split('.');
                        nameParts.pop();
                        name = nameParts.join('.') + '.' + newExt;
                    }
                    
                    const uniqueName = await getUniqueFileName(name);
                    await db.files.add({ folderId: Number(currentFolderId), projectId: Number(currentProjectId), name: uniqueName, type: blob.type, oldSize: file.size, newSize: blob.size, blob });

                } catch (error) {
                    console.error(`Failed to process file: ${file.name}`, error);
                    alert(`Could not process '${file.name}'. The file may be corrupt or in an unsupported format.`);
                }
            }

            loader.classList.add('hidden');
            loader.classList.remove('flex');
            e.target.value = ''; 
            await loadFiles();
        }


        async function getUniqueFileName(name) {
            let uniqueName = name; let count = 1;
            while (await db.files.where({ folderId: Number(currentFolderId), name: uniqueName }).count() > 0) {
                const nameParts = name.split('.'); const ext = nameParts.pop();
                uniqueName = `${nameParts.join('.')} (${count++}).${ext}`;
            }
            return uniqueName;
        }

        // --- কম্প্রেশন হেল্পার ফাংশন ---
        function compressImg(f, factor, ext) {
            return new Promise((res, rej) => {
                const img = new Image(); img.src = URL.createObjectURL(f);
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    canvas.width = img.width * factor; canvas.height = img.height * factor;
                    canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
                    const quality = Math.max(0.5, 1 - (currentMode / 15));
                    canvas.toBlob(b => b ? res(b) : rej(new Error('Canvas to Blob failed')), 'image/' + ext, quality);
                };
                img.onerror = () => rej(new Error('Image loading failed'));
            });
        }

        function compressAudio(f, br) {
            return new Promise(async (res, rej) => {
                try {
                    const buf = await f.arrayBuffer(); const ctx = new (window.AudioContext || window.webkitAudioContext)();
                    const data = await ctx.decodeAudioData(buf); const enc = new lamejs.Mp3Encoder(data.numberOfChannels, data.sampleRate, br);
                    const mp3 = []; const sampleBlockSize = 1152;
                    for (let ch = 0; ch < data.numberOfChannels; ch++) {
                        const channelData = data.getChannelData(ch);
                        for (let i = 0; i < channelData.length; i += sampleBlockSize) {
                            const sampleChunk = new Int16Array(channelData.subarray(i, i + sampleBlockSize).length);
                            for (let j = 0; j < sampleChunk.length; j++) { sampleChunk[j] = Math.max(-1, Math.min(1, channelData[i+j])) * 0x7FFF; }
                            const mp3buf = enc.encodeBuffer(sampleChunk);
                            if (mp3buf.length > 0) mp3.push(mp3buf);
                        }
                    }
                    const fl = enc.flush(); if (fl.length > 0) mp3.push(fl);
                    res(new Blob(mp3, { type: 'audio/mp3' }));
                } catch (e) { rej(e); }
            });
        }
        
        // *** নতুন ভিডিও কম্প্রেশন ফাংশন (MediaRecorder ও ফলব্যাকসহ) ***
        function compressVid(file, bitrate, preferredFormat) {
            return new Promise((resolve, reject) => {
                const v = document.getElementById('hVideo');
                v.src = URL.createObjectURL(file);
                
                v.onloadedmetadata = () => {
                    let mimeType;
                    let actualExtension;

                    const mp4MimeType = 'video/mp4; codecs="avc1.42E01E"'; // একটি সাধারণ H.264 প্রোফাইল
                    const webmFallBackMimeType = 'video/webm; codecs=vp9';

                    if (preferredFormat === 'mp4' && MediaRecorder.isTypeSupported(mp4MimeType)) {
                        mimeType = mp4MimeType;
                        actualExtension = 'mp4';
                        console.log("Browser supports MP4 recording. Using MP4.");
                    } else {
                        mimeType = webmFallBackMimeType;
                        actualExtension = 'webm';
                        if (preferredFormat === 'mp4') {
                            console.warn("Browser does not support MP4 recording. Falling back to WebM.");
                        }
                    }

                    if (!MediaRecorder.isTypeSupported(mimeType)) {
                        return reject(new Error(`Video compression is not supported in this browser.`));
                    }

                    const stream = v.captureStream();
                    const recorder = new MediaRecorder(stream, { mimeType, videoBitsPerSecond: bitrate });
                    const chunks = [];
                    recorder.ondataavailable = e => e.data.size > 0 && chunks.push(e.data);
                    
                    recorder.onstop = () => {
                        const resultBlob = new Blob(chunks, { type: mimeType });
                        resolve({ blob: resultBlob, actualExtension: actualExtension });
                    };
                    
                    recorder.onerror = (e) => reject(e);
                    
                    v.play();
                    v.onended = () => { if(recorder.state === "recording") recorder.stop(); };
                    // রিসোর্স লিক এড়ানোর জন্য URL টি রিলিজ করা
                    v.onpause = () => URL.revokeObjectURL(v.src);
                };

                v.onerror = () => reject(new Error('Video file could not be loaded.'));
            });
        }

        // --- বাকি ফাংশনগুলো অপরিবর্তিত ---
        async function createProject() { const name = await showInputModal("Create New Project", "Project Name"); if(name) { const id = await db.projects.add({name}); await db.folders.add({projectId: id, name: "Root"}); await switchProject(id); } }
        async function deleteCurrentProject() { const confirmed = await showConfirmModal("Delete Project?", `Are you sure you want to delete "${document.getElementById('activeProjectName').innerText}" and all its contents?`); if(confirmed) { const pid = Number(currentProjectId); await db.projects.delete(pid); await db.folders.where({ projectId: pid }).delete(); await db.files.where({ projectId: pid }).delete(); currentProjectId = null; currentFolderId = null; await init(); } }
        async function switchProject(id) { currentProjectId = Number(id); currentFolderId = null; await loadApp(); toggleSheet('projectSheet'); }
        async function addFolder() { const name = await showInputModal("Create New Folder", "Folder Name"); if(name) { await db.folders.add({projectId: Number(currentProjectId), name}); await renderFolderList(); } }
        async function renameFolder(ev, id, oldName) { ev.stopPropagation(); const newName = await showInputModal("Rename Folder", "New Name", oldName); if(newName && newName !== oldName) { await db.folders.update(id, {name: newName}); await renderFolderList(); if (id === currentFolderId) { document.getElementById('currentFolderName').innerText = newName; } } }
        async function deleteFolder(ev, id) { ev.stopPropagation(); const confirmed = await showConfirmModal("Delete Folder?", "This will delete the folder and all files inside it."); if(confirmed) { await db.folders.delete(id); await db.files.where({ folderId: id }).delete(); if (currentFolderId === id) { currentFolderId = null; } await loadApp(); toggleSheet('folderSheet'); } }
        async function switchFolder(id) { currentFolderId = Number(id); await loadFiles(); await renderFolderList(); toggleSheet('folderSheet'); }
        function openMoveSheet(id) { movingFileId = Number(id); toggleSheet('moveSheet'); }
        async function executeMove(targetId) { if (movingFileId && movingFileId !== targetId) { await db.files.update(movingFileId, { folderId: Number(targetId) }); toggleSheet('moveSheet'); await loadFiles(); movingFileId = null; } else { toggleSheet('moveSheet'); } }
        async function handleDrop(ev, targetId) { ev.preventDefault(); ev.currentTarget.classList.remove('bg-blue-600/20'); const fId = ev.dataTransfer.getData("fId"); if(fId) { await db.files.update(Number(fId), { folderId: Number(targetId) }); await loadFiles(); } }
        function setMode(m) { currentMode = Number(m); document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active-btn')); document.getElementById('m-'+m).classList.add('active-btn'); document.getElementById('formatSection').style.opacity = currentMode === 1 ? "0.3" : "1"; document.getElementById('formatSection').style.pointerEvents = currentMode === 1 ? "none" : "auto"; }
        function setFormat(cat, ext) { targetFormats[cat] = ext; document.querySelectorAll(`.f-${cat}`).forEach(b => b.classList.remove('active-btn')); document.getElementById(`f-${cat}-${ext}`).classList.add('active-btn'); }
        function toggleSheet(id) { const s = document.getElementById(id); if(s.classList.contains('hidden')) { s.classList.remove('hidden'); setTimeout(() => s.classList.add('active'), 10); } else { s.classList.remove('active'); setTimeout(() => s.classList.add('hidden'), 400); } }
        async function previewFile(id) { const f = await db.files.get(Number(id)); if (!f) return; const url = URL.createObjectURL(f.blob); const content = document.getElementById('previewContent'); content.innerHTML = ''; if(f.type.includes('image')) content.innerHTML = `<img src="${url}" class="max-h-[60vh] rounded-[3rem]">`; else if(f.type.includes('video')) content.innerHTML = `<video src="${url}" controls autoplay class="max-h-[60vh] rounded-[2rem]"></video>`; else if(f.type.includes('audio')) content.innerHTML = `<div class="p-12 text-center bg-gray-900 rounded-[3rem]"><i class="fas fa-compact-disc text-8xl text-blue-500 animate-spin mb-8"></i><audio src="${url}" controls autoplay class="w-full"></audio></div>`; document.getElementById('previewTitle').innerText = f.name; document.getElementById('previewSize').innerText = `${(f.newSize/1024/1024).toFixed(2)} MB • READY`; document.getElementById('delBtn').onclick = async () => { const confirmed = await showConfirmModal("Delete File?", "Are you sure you want to delete this file?"); if(confirmed) { await db.files.delete(id); await loadFiles(); closePreview(); } }; document.getElementById('renBtn').onclick = async () => { const newName = await showInputModal("Rename File", "New file name", f.name); if(newName && newName !== f.name) { const uniqueName = await getUniqueFileName(newName); await db.files.update(id, {name: uniqueName}); await loadFiles(); closePreview(); } }; document.getElementById('previewModal').classList.remove('hidden'); }
        function closePreview() { const modal = document.getElementById('previewModal'); modal.classList.add('hidden'); document.getElementById('previewContent').innerHTML = ''; }
        async function downloadFolderZip() { const files = await db.files.where({ folderId: Number(currentFolderId) }).toArray(); if (files.length === 0) { alert("This folder is empty."); return; } const zip = new JSZip(); files.forEach(f => zip.file(f.name, f.blob)); const blob = await zip.generateAsync({ type: "blob" }); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); const folderName = document.getElementById('currentFolderName').innerText; a.download = `${folderName}_assetpro_${Date.now()}.zip`; a.click(); URL.revokeObjectURL(a.href); }
        function showCustomModal({ title, message, input = null, buttons }) { return new Promise(resolve => { const modal = document.getElementById('customModal'); document.getElementById('modalTitle').textContent = title; document.getElementById('modalMessage').textContent = message; const modalInput = document.getElementById('modalInput'); const modalButtons = document.getElementById('modalButtons'); if (input !== null) { modalInput.style.display = 'block'; modalInput.value = input.value || ''; modalInput.placeholder = input.placeholder || ''; } else { modalInput.style.display = 'none'; } modalButtons.innerHTML = ''; buttons.forEach(btn => { const buttonEl = document.createElement('button'); buttonEl.className = btn.class; buttonEl.textContent = btn.text; buttonEl.onclick = () => { const val = input !== null ? modalInput.value : btn.value; modal.classList.remove('active'); setTimeout(() => modal.classList.add('hidden'), 300); resolve(val); }; modalButtons.appendChild(buttonEl); }); modal.classList.remove('hidden'); setTimeout(() => modal.classList.add('active'), 10); if (input !== null) modalInput.focus(); }); }
        function showInputModal(title, message, defaultValue = '') { return showCustomModal({ title, message, input: { value: defaultValue, placeholder: 'Type here...' }, buttons: [ { text: 'Cancel', value: null, class: 'flex-1 bg-gray-700 text-white py-4 rounded-[1.5rem] font-black uppercase' }, { text: 'Confirm', value: true, class: 'flex-1 bg-blue-600 text-white py-4 rounded-[1.5rem] font-black uppercase' } ] }).then(val => val ? document.getElementById('modalInput').value : null); }
        function showConfirmModal(title, message) { return showCustomModal({ title, message, buttons: [ { text: 'No', value: false, class: 'flex-1 bg-gray-700 text-white py-4 rounded-[1.5rem] font-black uppercase' }, { text: 'Yes', value: true, class: 'flex-1 bg-red-600 text-white py-4 rounded-[1.5rem] font-black uppercase' } ] }); }
        
        // --- অ্যাপ চালু করা ---
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
