<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal JSON Master</title>
    <style>
        :root {
            --primary: #2c3e50;
            --accent: #27ae60;
            --light: #ecf0f1;
            --danger: #e74c3c;
            --dark: #34495e;
        }
        body { font-family: 'Segoe UI', sans-serif; background: #f4f7f6; padding: 20px; color: #333; max-width: 1000px; margin: 0 auto; }
        
        h1 { text-align: center; color: var(--primary); margin-bottom: 5px; }
        p.subtitle { text-align: center; color: #7f8c8d; margin-bottom: 30px; }

        /* Card Style */
        .card { background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 25px; }
        h2 { border-bottom: 2px solid var(--light); padding-bottom: 10px; margin-top: 0; color: var(--dark); font-size: 1.2rem; }

        /* Grid Layout */
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        @media (max-width: 768px) { .grid-2 { grid-template-columns: 1fr; } }

        /* Inputs & Buttons */
        input, select, textarea { 
            width: 100%; padding: 12px; margin-bottom: 10px; border: 1px solid #ddd; 
            border-radius: 6px; box-sizing: border-box; font-size: 1rem; transition: 0.3s;
        }
        input:focus, select:focus { border-color: var(--accent); outline: none; }

        button { 
            cursor: pointer; padding: 12px 20px; border: none; border-radius: 6px; 
            font-weight: bold; color: white; transition: 0.2s; width: 100%; font-size: 1rem; 
        }
        button:hover { transform: translateY(-2px); opacity: 0.9; }

        .btn-green { background: var(--accent); }
        .btn-blue { background: #2980b9; }
        .btn-red { background: var(--danger); }
        .btn-orange { background: #e67e22; }
        .btn-gray { background: #95a5a6; color: white; }

        /* Step 1: Schema Builder */
        .field-row { 
            display: flex; gap: 10px; align-items: center; background: #f8f9fa; 
            padding: 10px; border-radius: 6px; margin-bottom: 8px; border: 1px solid #eee;
        }
        .remove-btn { width: auto; padding: 8px 12px; margin-bottom: 0; }

        /* Step 2: Generated Form */
        .generated-input-group label { font-weight: bold; font-size: 0.9rem; color: #555; display: block; margin-bottom: 5px; }
        
        /* Checkbox Switch Style */
        .switch-wrapper { display: flex; align-items: center; margin-bottom: 10px; background: #f0f0f0; padding: 10px; border-radius: 5px; }
        .switch-wrapper input[type="checkbox"] { width: auto; margin-right: 10px; transform: scale(1.5); }
        
        /* List & Output */
        .item-list { max-height: 300px; overflow-y: auto; border: 1px solid #eee; border-radius: 6px; margin-bottom: 15px; }
        .list-item { 
            padding: 10px 15px; border-bottom: 1px solid #eee; display: flex; 
            justify-content: space-between; align-items: center; background: #fff;
        }
        .list-item:nth-child(even) { background: #f9f9f9; }
        
        textarea#jsonOutput { 
            background: #2d3436; color: #00cec9; font-family: 'Courier New', monospace; 
            height: 150px; font-size: 0.9rem; 
        }

        /* Step Control */
        #step2 { display: none; }
    </style>
</head>
<body>

    <h1>🚀 Universal JSON Master</h1>
    <p class="subtitle">Design structure once, generate unlimited data.</p>

    <div class="card" id="step1">
        <h2>🛠️ Step 1: Define Fields (Structure)</h2>
        <p style="font-size: 0.9rem; color: #666;">Add fields that you need for your JSON (e.g. Name, Icon, Link).</p>
        
        <div id="schemaContainer"></div>

        <div style="display: flex; gap: 10px; margin-top: 15px;">
            <button class="btn-blue" onclick="addField()">+ Add New Field</button>
            <button class="btn-green" onclick="saveSchema()">✅ Save & Start Entry</button>
        </div>
        
        <div style="margin-top: 20px; padding-top: 15px; border-top: 1px dashed #ddd;">
            <small><strong>Quick Templates:</strong></small>
            <div style="display: flex; gap: 10px; margin-top: 5px;">
                <button class="btn-gray" style="width: auto; padding: 5px 10px; font-size: 0.8rem;" onclick="loadTemplate('tools')">Load App Tools Template</button>
                <button class="btn-gray" style="width: auto; padding: 5px 10px; font-size: 0.8rem;" onclick="loadTemplate('ads')">Load Ads Template</button>
            </div>
        </div>
    </div>

    <div id="step2" class="grid-2">
        
        <div class="card">
            <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #ecf0f1; padding-bottom: 10px; margin-bottom: 15px;">
                <h2 style="border:none; padding:0; margin:0;">📝 Enter Data</h2>
                <button class="btn-orange" style="width: auto; padding: 5px 10px; font-size: 0.8rem;" onclick="resetToStep1()">⚙️ Edit Structure</button>
            </div>
            
            <form id="dynamicForm" onsubmit="event.preventDefault(); addToJSON();">
                </form>

            <button class="btn-green" style="margin-top: 10px;" onclick="addToJSON()">➕ Add Item to List</button>
        </div>

        <div class="card">
            <h2>📦 Item List (<span id="count">0</span>)</h2>
            <div class="item-list" id="itemList">
                <div style="padding:15px; text-align:center; color:#999;">List is empty...</div>
            </div>
            
            <textarea id="jsonOutput" readonly onclick="this.select()"></textarea>
            
            <div style="display: flex; gap: 10px; margin-top: 10px;">
                <button class="btn-blue" onclick="copyJSON()">📋 Copy JSON</button>
                <button class="btn-red" onclick="clearData()">🗑️ Clear All</button>
            </div>
        </div>
    </div>

    <script>
        // --- DATA STORE ---
        let schema = []; // Stores field definitions
        let jsonData = []; // Stores final data objects

        // --- STEP 1: SCHEMA BUILDER LOGIC ---
        
        // Initial setup
        window.onload = function() {
            addField('name', 'text'); // Default field
            addField('link', 'url');  // Default field
        };

        function addField(key = '', type = 'text') {
            const container = document.getElementById('schemaContainer');
            const div = document.createElement('div');
            div.className = 'field-row';
            div.innerHTML = `
                <input type="text" placeholder="Field Name (e.g. price)" class="schema-key" value="${key}">
                <select class="schema-type">
                    <option value="text" ${type=='text'?'selected':''}>Text / Emoji</option>
                    <option value="url" ${type=='url'?'selected':''}>Link (URL)</option>
                    <option value="number" ${type=='number'?'selected':''}>Number</option>
                    <option value="color" ${type=='color'?'selected':''}>Color Picker</option>
                    <option value="boolean" ${type=='boolean'?'selected':''}>True/False Switch</option>
                    <option value="textarea" ${type=='textarea'?'selected':''}>Long Text</option>
                </select>
                <button class="btn-red remove-btn" onclick="this.parentElement.remove()">✖</button>
            `;
            container.appendChild(div);
        }

        function loadTemplate(type) {
            document.getElementById('schemaContainer').innerHTML = '';
            if(type === 'tools') {
                addField('id', 'number');
                addField('name', 'text');
                addField('icon', 'text');
                addField('category', 'text');
                addField('link', 'url');
            } else if(type === 'ads') {
                addField('id', 'number');
                addField('text', 'text');
                addField('link', 'url');
                addField('bgColor', 'color');
                addField('textColor', 'color');
            }
        }

        function saveSchema() {
            const rows = document.querySelectorAll('.field-row');
            let tempSchema = [];
            let isValid = true;

            rows.forEach(row => {
                const key = row.querySelector('.schema-key').value.trim();
                const type = row.querySelector('.schema-type').value;
                if(!key) isValid = false;
                tempSchema.push({ key, type });
            });

            if(!isValid || tempSchema.length === 0) {
                alert("Please give a name to all fields!");
                return;
            }

            schema = tempSchema;
            generateEntryForm();
            
            // Switch UI
            document.getElementById('step1').style.display = 'none';
            document.getElementById('step2').style.display = 'grid';
        }

        // --- STEP 2: DYNAMIC FORM GENERATION ---

        function generateEntryForm() {
            const form = document.getElementById('dynamicForm');
            form.innerHTML = '';

            schema.forEach(field => {
                const wrapper = document.createElement('div');
                wrapper.className = 'generated-input-group';
                
                // Label
                const label = document.createElement('label');
                label.innerText = field.key.toUpperCase();
                
                let input;

                if(field.type === 'textarea') {
                    input = document.createElement('textarea');
                    input.rows = 3;
                } else if (field.type === 'boolean') {
                    // Custom Toggle UI
                    wrapper.className = 'switch-wrapper';
                    label.style.marginBottom = '0';
                    label.style.flexGrow = '1';
                    input = document.createElement('input');
                    input.type = 'checkbox';
                } else {
                    input = document.createElement('input');
                    input.type = field.type;
                    if(field.type === 'number' && field.key === 'id') {
                        input.placeholder = "Leave empty for Auto ID";
                    }
                }

                input.id = `input-${field.key}`;
                input.dataset.type = field.type; // Store type for retrieval
                
                if(field.type !== 'boolean') {
                    input.placeholder = `Enter ${field.key}...`;
                    wrapper.appendChild(label);
                    wrapper.appendChild(input);
                } else {
                    wrapper.appendChild(input); // Checkbox first
                    wrapper.appendChild(label);
                }

                form.appendChild(wrapper);
            });
        }

        // --- DATA HANDLING ---

        function addToJSON() {
            let newItem = {};
            let hasData = false;

            schema.forEach(field => {
                const input = document.getElementById(`input-${field.key}`);
                
                if (field.type === 'boolean') {
                    newItem[field.key] = input.checked;
                    hasData = true; 
                } else {
                    let val = input.value;
                    
                    // Auto ID Logic
                    if(field.key === 'id' && field.type === 'number' && val === '') {
                        val = Date.now(); // Generate Timestamp ID
                    } else if (field.type === 'number') {
                        val = Number(val);
                    }
                    
                    if(val !== '') hasData = true;
                    newItem[field.key] = val;
                }
            });

            if(!hasData) return alert("Please fill in some data.");

            jsonData.push(newItem);
            updateOutput();
            
            // Clear inputs (except colors usually stay)
            document.getElementById('dynamicForm').reset();
        }

        function updateOutput() {
            const list = document.getElementById('itemList');
            list.innerHTML = '';

            if(jsonData.length === 0) {
                list.innerHTML = '<div style="padding:15px; text-align:center; color:#999;">List is empty...</div>';
            }

            jsonData.forEach((item, index) => {
                // Try to find a good title field
                let title = item.name || item.title || item.text || item.id || `Item ${index+1}`;
                
                const div = document.createElement('div');
                div.className = 'list-item';
                div.innerHTML = `
                    <strong>${title}</strong>
                    <button class="btn-red remove-btn" onclick="deleteItem(${index})">✖</button>
                `;
                list.appendChild(div);
            });

            document.getElementById('count').innerText = jsonData.length;
            document.getElementById('jsonOutput').value = JSON.stringify(jsonData, null, 2);
        }

        function deleteItem(index) {
            jsonData.splice(index, 1);
            updateOutput();
        }

        function clearData() {
            if(confirm("Are you sure you want to delete all items?")) {
                jsonData = [];
                updateOutput();
            }
        }

        function copyJSON() {
            const textarea = document.getElementById('jsonOutput');
            textarea.select();
            navigator.clipboard.writeText(textarea.value).then(() => {
                alert("✅ JSON Copied to Clipboard!");
            });
        }

        function resetToStep1() {
            if(confirm("Going back to edit structure will keep your current list, but changing fields might mess up existing data. Continue?")) {
                document.getElementById('step2').style.display = 'none';
                document.getElementById('step1').style.display = 'block';
            }
        }

    </script>
</body>
</html>
